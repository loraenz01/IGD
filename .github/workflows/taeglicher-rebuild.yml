# Baut die Website jede Nacht neu, damit vergangene Anlässe automatisch
# in die «Rückblicke» wandern (Briefing Kap. 8).
# Benötigt das GitHub-Secret NETLIFY_BUILD_HOOK (Build Hook aus Netlify).
name: Täglicher Rebuild

on:
  schedule:
    - cron: '17 1 * * *' # täglich ca. 02:17/03:17 Uhr Schweizer Zeit
  workflow_dispatch: {} # manuell auslösbar unter «Actions»

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Netlify-Build auslösen
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret NETLIFY_BUILD_HOOK fehlt – siehe README."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK"
          echo "Build ausgelöst."
